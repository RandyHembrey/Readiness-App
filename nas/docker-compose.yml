# Home NAS app stack: Caddy (HTTPS + routing) -> apps portal + individual apps.
# Synology DSM already owns host ports 80/443, so Caddy listens on 8080/8443
# and the router forwards WAN 80 -> NAS:8080 and WAN 443 -> NAS:8443.
name: hembrey-apps

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps-portal/html:/srv/apps-portal:ro
      - ./volumes/caddy-data:/data
      - ./volumes/caddy-config:/config
    depends_on:
      - race-todo

  race-todo:
    build: ./race-todo
    image: hembrey/race-todo:latest
    container_name: race-todo
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${RACE_TODO_PASSWORD:?set RACE_TODO_PASSWORD in .env}
      APP_TITLE: ${RACE_TODO_TITLE:-USF Pro Championships · Event Readiness}
      DEMO_DATA: ${RACE_TODO_DEMO_DATA:-0}   # 1 = load a mock season into an empty database
    volumes:
      - ./volumes/race-todo:/data
