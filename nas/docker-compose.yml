# Hembrey public apps stack, Synology NAS. No Cloudflare: the home router forwards
# only WAN 80/443 to Caddy, and everything else stays private.
#
# Isolation:
#   - Only Caddy publishes ports (8080/8443; DSM keeps 80/443 for itself).
#   - Apps sit on an INTERNAL Docker network: no internet, no LAN, no host.
#     They can only be reached by Caddy, and only on the hostnames in the Caddyfile.
#   - Every container drops all Linux capabilities, can't gain privileges, and has
#     a read-only root filesystem. App code is mounted read-only.
#
# File-only deploys: Caddy (--watch) and the apps (node --watch) reload when their
# files change, so a non-admin NAS user can update code without Container Manager.
name: hembrey-apps

networks:
  edge: {}                 # Caddy <-> internet (needed for HTTPS certificates)
  apps:
    internal: true         # apps <-> Caddy only; no route to LAN or internet
  mail: {}                 # mail relay <-> internet (outbound SMTP to your mail provider only)

services:
  caddy:
    image: caddy:2-alpine
    container_name: hembrey-caddy
    restart: unless-stopped
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    ports:
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./apps-portal/html:/srv/apps-portal:ro
      - ./volumes/caddy-data:/data
      - ./volumes/caddy-config:/config
    networks: [edge, apps]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, DAC_OVERRIDE]   # DAC_OVERRIDE: write to Synology-ACL'd data folders
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

  race-todo:
    image: node:24-alpine
    container_name: hembrey-race-todo
    restart: unless-stopped
    working_dir: /app
    command: node --watch-path=/app/server.js --watch-path=/app/seed.js server.js
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      APP_PASSWORD: ${RACE_TODO_PASSWORD:?set RACE_TODO_PASSWORD in .env}
      APP_TITLE: ${RACE_TODO_TITLE:-USF Pro Championships · Event Readiness}
      DEMO_DATA: ${RACE_TODO_DEMO_DATA:-0}   # 1 = load a mock season into an empty database
      # Email notifications (weekly reports + daily reminders). Off until MAIL_FROM is set.
      SMTP_HOST: mailrelay
      SMTP_PORT: "587"
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: https://races.hembrey.com
      WEEKLY_REPORT_DAY: ${WEEKLY_REPORT_DAY:-mon}
      NOTIFY_HOUR: ${NOTIFY_HOUR:-7}
      DAILY_REMINDERS: ${DAILY_REMINDERS:-1}
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./race-todo:/app:ro
      - ./volumes/race-todo:/data
    networks: [apps]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]   # write to Synology-ACL'd data folder
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s

  # Outbound-only mail relay. Apps hand it mail over the internal network; it alone may reach
  # your mail provider (port 587, authenticated, TLS). Nothing reaches it from outside.
  mailrelay:
    image: boky/postfix:latest
    container_name: hembrey-mailrelay
    restart: unless-stopped
    environment:
      RELAYHOST: ${SMTP_RELAY_HOST:-[smtp.gmail.com]:587}
      RELAYHOST_USERNAME: ${SMTP_RELAY_USER:-}
      RELAYHOST_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
      ALLOWED_SENDER_DOMAINS: ${MAIL_SENDER_DOMAIN:-hembrey.com}
      POSTFIX_myhostname: mail.hembrey.com
    networks: [apps, mail]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
