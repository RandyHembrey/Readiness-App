<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>USF Pro Championships · Event Readiness</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<style>
  :root{
    --bg:#f6f6f3; --panel:#ffffff; --panel-2:#f0f0ec; --border:rgba(11,11,11,.10); --fg:#0b0b0b; --fg-2:#4a4a46; --muted:#6f6f69;
    --accent:#2a62d9; --accent-track:#d9e4fa; --grid:#e1e0d9; --axis:#c3c2b7;
    --good:#0ca30c; --good-text:#006300; --warning:#fab219; --critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111110; --panel:#1a1a19; --panel-2:#232321; --border:rgba(255,255,255,.10); --fg:#f3f3ef; --fg-2:#c8c8c2; --muted:#9a9a93;
      --accent:#5b8cf0; --accent-track:#24345a; --grid:#2c2c2a; --axis:#383835; --good-text:#0ca30c; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{max-width:1100px;margin:0 auto;padding:0 16px 64px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:18px}
  header h1{font-size:1.15rem;margin:0;margin-right:auto}
  nav{display:flex;gap:4px}
  nav button{background:none;border:none;color:var(--fg-2);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:.9rem}
  nav button.active{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--border);font-weight:600}
  h2{font-size:1rem;margin:0 0 10px}
  .muted{color:var(--muted);font-size:.85rem}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.88rem;cursor:pointer;white-space:nowrap}
  .btn.secondary{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--border)}
  .btn.ghost{background:none;color:var(--muted);padding:4px 8px}
  .btn.danger{background:var(--critical)}
  input,select,textarea{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel-2);color:var(--fg);width:100%}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--good);cursor:pointer;flex:none}
  label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:3px}
  .card{background:var(--panel);border-radius:12px;box-shadow:0 0 0 1px var(--border);padding:16px;margin-bottom:16px}
  .grid{display:grid;gap:12px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
  .tile{background:var(--panel);border-radius:12px;box-shadow:0 0 0 1px var(--border);padding:14px 16px}
  .tile .label{font-size:.8rem;color:var(--muted)}
  .tile .value{font-size:1.7rem;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .tile .sub{font-size:.78rem;color:var(--fg-2)}
  .two{grid-template-columns:1fr 1fr} @media (max-width:820px){.two{grid-template-columns:1fr}}
  .status{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;white-space:nowrap}
  .status.overdue{color:var(--critical)} .status.soon{color:var(--fg-2)} .status.done{color:var(--good-text)}
  .status .ico{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font-size:10px;color:#fff;line-height:1}
  .status.overdue .ico{background:var(--critical)} .status.soon .ico{background:var(--warning);color:#0b0b0b} .status.done .ico{background:var(--good)}
  .task{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--grid)}
  .task:first-child{border-top:none}
  .task .body{flex:1;min-width:0}
  .task .title{font-size:.92rem}
  .task.is-done .title{text-decoration:line-through;color:var(--muted)}
  .task .meta{font-size:.78rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
  .pill{font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--panel-2);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--border)}
  .event-row{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--grid);cursor:pointer}
  .event-row:first-of-type{border-top:none}
  .event-row:hover .ev-name{color:var(--accent)}
  .ev-name{font-weight:600}
  @media (max-width:600px){.event-row{grid-template-columns:1fr}}
  .meter{height:8px;border-radius:999px;background:var(--accent-track);overflow:hidden}
  .meter > span{display:block;height:100%;border-radius:999px;background:var(--accent)}
  .meter.complete > span{background:var(--good)}
  .meter-label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--fg-2);margin-top:5px;font-variant-numeric:tabular-nums}
  /* due-by-week bar chart */
  .chart{position:relative}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .chart .tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--border),0 4px 14px rgba(0,0,0,.15);border-radius:8px;padding:6px 9px;font-size:.78rem;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;display:none}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar select,.toolbar input{width:auto}
  .form-row{display:grid;gap:10px;grid-template-columns:2fr 1fr 1fr 1fr auto;align-items:end}
  @media (max-width:760px){.form-row{grid-template-columns:1fr 1fr}}
  .cat-head{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 2px;font-weight:600}
  dialog{border:none;border-radius:14px;background:var(--panel);color:var(--fg);padding:20px;width:min(520px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .field{margin-bottom:10px}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.85rem;display:none;z-index:10}
  .login{max-width:340px;margin:12vh auto;text-align:center}
  .empty{color:var(--muted);font-size:.88rem;padding:8px 0}
  table.tmpl{width:100%;border-collapse:collapse;font-size:.88rem}
  table.tmpl td,table.tmpl th{padding:6px 6px;border-top:1px solid var(--grid);text-align:left;vertical-align:middle}
  table.tmpl th{font-size:.75rem;color:var(--muted);font-weight:600;border-top:none}
  table.tmpl input{padding:5px 7px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<script>
// In-browser stand-in for server.js so the UI can be demoed as a single static page.
// Data lives in localStorage; "Reset demo" in the footer restores the mock season.
window.RACE_MAKE_LOCAL_API = function () {
  var KEY = 'race-todo-demo-v1';
  var SEED = window.RACE_SEED;
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(s, n) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + Number(n || 0)); return ymd(d); }
  function fresh() {
    var db = { seq: 1, template: [], events: [], tasks: [] };
    SEED.TEMPLATE.forEach(function (t, i) { db.template.push({ id: db.seq++, category: t[0], offset_days: t[1], title: t[2], owner: t[3] || '', notes: '', sort_order: i }); });
    var today = ymd(new Date()), soon = addDays(today, 21);
    SEED.DEMO_EVENTS.forEach(function (e, ei) {
      var ev = { id: db.seq++, name: e.name, event_date: addDays(today, e.inDays), location: e.location, notes: e.notes, archived: 0 };
      db.events.push(ev);
      db.template.forEach(function (t, i) {
        var due = addDays(ev.event_date, t.offset_days), hsh = (ei * 31 + i * 17) % 100;
        var done = due < today ? hsh < e.done * 100 : (due < soon && hsh < 25);
        db.tasks.push({ id: db.seq++, event_id: ev.id, title: t.title, category: t.category, due_date: due, owner: t.owner, notes: '', sort_order: i, done: done ? 1 : 0, done_at: done ? new Date().toISOString() : null });
      });
    });
    return db;
  }
  var db;
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!db) db = fresh();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
  save();
  window.RACE_DEMO_RESET = function () { db = fresh(); save(); location.hash = ''; location.reload(); };

  function byDue(a, b) { return (a.due_date || '9999') < (b.due_date || '9999') ? -1 : (a.due_date || '9999') > (b.due_date || '9999') ? 1 : a.sort_order - b.sort_order; }
  function evName(t) { var e = db.events.find(function (x) { return x.id === t.event_id; }); return Object.assign({}, t, { event_name: e.name, event_date: e.event_date }); }
  function pick(o, b, k) { return b[k] !== undefined ? b[k] : o[k]; }
  function copyTemplate(ev, onlyMissing) {
    var have = new Set(db.tasks.filter(function (t) { return t.event_id === ev.id; }).map(function (t) { return t.title.toLowerCase(); }));
    var added = 0;
    db.template.slice().sort(function (a, b) { return a.offset_days - b.offset_days; }).forEach(function (t, i) {
      if (onlyMissing && have.has(t.title.toLowerCase())) return;
      db.tasks.push({ id: db.seq++, event_id: ev.id, title: t.title, category: t.category, due_date: addDays(ev.event_date, t.offset_days), owner: t.owner, notes: t.notes, sort_order: i, done: 0, done_at: null });
      added++;
    });
    return added;
  }

  function handle(method, url, b) {
    b = b || {};
    var m, id;
    if (url === '/api/me') return { authed: true, passwordRequired: false, title: 'USF Pro Championships · Event Readiness (demo)' };
    if (url === '/api/state') return {
      events: db.events.slice().sort(function (a, c) { return a.archived - c.archived || (a.event_date < c.event_date ? -1 : 1); }),
      tasks: db.tasks.slice().sort(byDue).map(evName),
      template: db.template.slice().sort(function (a, c) { return a.offset_days - c.offset_days || a.sort_order - c.sort_order; }),
    };
    if (method === 'POST' && url === '/api/events') {
      if (!b.name || !b.event_date) throw new Error('Name and event date are required');
      var ev = { id: db.seq++, name: b.name, event_date: b.event_date, location: b.location || '', notes: b.notes || '', archived: 0 };
      db.events.push(ev);
      if (b.apply_template !== false) copyTemplate(ev, false);
      return ev;
    }
    if ((m = url.match(/^\/api\/events\/(\d+)$/))) {
      id = +m[1];
      var e = db.events.find(function (x) { return x.id === id; });
      if (method === 'DELETE') { db.events = db.events.filter(function (x) { return x.id !== id; }); db.tasks = db.tasks.filter(function (t) { return t.event_id !== id; }); return { ok: true }; }
      var old = e.event_date;
      ['name', 'location', 'notes'].forEach(function (k) { e[k] = pick(e, b, k); });
      if (b.event_date) e.event_date = b.event_date;
      if (b.archived !== undefined) e.archived = b.archived ? 1 : 0;
      if (b.shift_tasks && old !== e.event_date) {
        var delta = Math.round((Date.parse(e.event_date) - Date.parse(old)) / 864e5);
        db.tasks.forEach(function (t) { if (t.event_id === id && !t.done && t.due_date) t.due_date = addDays(t.due_date, delta); });
      }
      return e;
    }
    if ((m = url.match(/^\/api\/events\/(\d+)\/tasks$/))) {
      var t = { id: db.seq++, event_id: +m[1], title: b.title, category: b.category || 'General', due_date: b.due_date || null, owner: b.owner || '', notes: b.notes || '', sort_order: 999, done: 0, done_at: null };
      db.tasks.push(t); return t;
    }
    if ((m = url.match(/^\/api\/events\/(\d+)\/apply-template$/))) {
      return { added: copyTemplate(db.events.find(function (x) { return x.id === +m[1]; }), true) };
    }
    if ((m = url.match(/^\/api\/tasks\/(\d+)$/))) {
      id = +m[1];
      if (method === 'DELETE') { db.tasks = db.tasks.filter(function (x) { return x.id !== id; }); return { ok: true }; }
      var tk = db.tasks.find(function (x) { return x.id === id; });
      ['title', 'category', 'owner', 'notes'].forEach(function (k) { tk[k] = pick(tk, b, k); });
      if (b.due_date !== undefined) tk.due_date = b.due_date || null;
      if (b.done !== undefined) { tk.done_at = b.done ? (tk.done ? tk.done_at : new Date().toISOString()) : null; tk.done = b.done ? 1 : 0; }
      return tk;
    }
    if (method === 'POST' && url === '/api/template') {
      var nt = { id: db.seq++, title: b.title, category: b.category || 'General', offset_days: parseInt(b.offset_days, 10) || 0, owner: b.owner || '', notes: '', sort_order: 999 };
      db.template.push(nt); return nt;
    }
    if ((m = url.match(/^\/api\/template\/(\d+)$/))) {
      id = +m[1];
      if (method === 'DELETE') { db.template = db.template.filter(function (x) { return x.id !== id; }); return { ok: true }; }
      var tt = db.template.find(function (x) { return x.id === id; });
      ['title', 'category', 'owner', 'notes'].forEach(function (k) { tt[k] = pick(tt, b, k); });
      if (b.offset_days !== undefined) tt.offset_days = parseInt(b.offset_days, 10) || 0;
      return tt;
    }
    if (url === '/api/logout') return { ok: true };
    throw new Error('Not available in demo');
  }

  return function (method, url, body) {
    return new Promise(function (resolve, reject) {
      try { var out = handle(method, url, body); save(); resolve(JSON.parse(JSON.stringify(out))); }
      catch (e) { reject(e); }
    });
  };
};
if (!window.RACE_DEFER_BACKEND) window.RACE_DEMO_API = window.RACE_MAKE_LOCAL_API();

</script>
<script>
// Shared-storage backend for the hosted (claude.ai artifact) version.
// Same API surface as server.js, backed by the artifact's realtime document store,
// so everyone the artifact is shared with sees the same events and checklist live.
// Collections: template/{id}, events/{id}, tasks/{id}. Falls back to the
// browser-only demo when shared storage isn't available (e.g. signed out).
window.RACE_DEFER_BACKEND = true;
window.RACE_BACKEND_READY = (async function () {
  var db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) {
    window.RACE_DEMO_API = window.RACE_MAKE_LOCAL_API();
    window.RACE_BACKEND_NOTE = 'Offline demo: shared storage is unavailable here, so changes stay in this browser only.';
    return;
  }

  var cache = { template: {}, events: {}, tasks: {} };
  var chains = {};
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(s, n) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + Number(n || 0)); return ymd(d); }
  function uid(p) { return p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function clean(o) { var r = {}; for (var k in o) if (k !== 'id' && k !== 'event_name') r[k] = o[k] === undefined ? null : o[k]; return r; }

  function serial(path, fn) {
    var p = (chains[path] || Promise.resolve()).catch(function () {}).then(fn);
    chains[path] = p;
    return p;
  }
  function writeErr(e) {
    var code = e && e.code;
    if (code === 'invalid_argument') throw new Error('You have view-only access to this tracker.');
    if (code === 'quota_exceeded') throw new Error('Storage is full; delete old events to make room.');
    throw new Error('Could not save (' + (code || 'error') + '). Please try again.');
  }
  // optimistic local update, then one serialized write per document
  function put(coll, row) {
    cache[coll][row.id] = row;
    var body = clean(row);
    return serial(coll + '/' + row.id, function () { return db.doc(coll + '/' + row.id).set(body); }).catch(writeErr);
  }
  function del(coll, id) {
    delete cache[coll][id];
    return serial(coll + '/' + id, function () { return db.doc(coll + '/' + id).delete(); }).catch(writeErr);
  }
  async function inBatches(items, n, fn) { for (var i = 0; i < items.length; i += n) await Promise.all(items.slice(i, i + n).map(fn)); }

  // live subscriptions (once)
  var changeTimer = null, firstLoads = 0, resolveFirst;
  var firstLoad = new Promise(function (r) { resolveFirst = r; });
  var timeout = setTimeout(function () {
    window.RACE_BACKEND_NOTE = 'Shared data is taking a while to load; what you see may be incomplete.';
    resolveFirst();
  }, 10000);
  ['template', 'events', 'tasks'].forEach(function (coll) {
    var seen = false;
    db.collection(coll).onSnapshot(function (snap) {
      var next = {};
      snap.docs.forEach(function (d) { if (d.exists) { var o = Object.assign({}, d.data()); o.id = d.id; next[d.id] = o; } });
      cache[coll] = next;

        h("div",{class:"muted"},fmtDate(ev.event_date)+" · "+(dd>=0?relDays(dd):"past")+(ev.location?" · "+ev.location:"")+(ev.archived?" · Archived":"")),
        ev.notes ? h("p",{style:"margin:8px 0 0;white-space:pre-wrap;font-size:.9rem"},ev.notes) : null
      ]),
      h("div",{style:"display:flex;gap:6px;flex-wrap:wrap"},[
        h("button",{class:"btn secondary",onclick:function(){openEditEvent(ev);}},"Edit event"),
        h("button",{class:"btn secondary",onclick:function(){ api("POST","/api/events/"+ev.id+"/apply-template").then(function(r){ toast(r.added ? r.added+" standard task(s) added" : "Already has every standard task"); load(); }); }},"Sync standard list"),
        h("button",{class:"btn secondary",onclick:function(){ api("PATCH","/api/events/"+ev.id,{archived:!ev.archived}).then(load); }}, ev.archived?"Unarchive":"Archive")
      ])
    ]),
    h("div",{style:"margin-top:14px"},[h("div",{class:"meter"+(st.pct===100?" complete":"")},h("span",{style:"width:"+st.pct+"%"})),
      h("div",{class:"meter-label"},[h("span",{},st.done+" of "+st.total+" done"+(st.overdue?" · "+st.overdue+" overdue":"")+(st.soon?" · "+st.soon+" due this week":"")),h("span",{},st.pct+"%")])])
  ]));

  // add task
  var f = { title:h("input",{placeholder:"New task…"}), due:h("input",{type:"date"}), cat:h("input",{placeholder:"Category",list:"cats"}), owner:h("input",{placeholder:"Owner"}) };
  root.appendChild(h("div",{class:"card"},[
    h("datalist",{id:"cats"}, cats.map(function(c){return h("option",{value:c});})),
    h("form",{class:"form-row",onsubmit:function(e){ e.preventDefault(); if(!f.title.value.trim()) return;
        api("POST","/api/events/"+ev.id+"/tasks",{title:f.title.value,due_date:f.due.value,category:f.cat.value,owner:f.owner.value}).then(function(){ toast("Task added"); load(); }).catch(function(e){toast(e.message);}); }},[
      h("div",{},[h("label",{},"Task"),f.title]), h("div",{},[h("label",{},"Due"),f.due]), h("div",{},[h("label",{},"Category"),f.cat]), h("div",{},[h("label",{},"Owner"),f.owner]),
      h("button",{class:"btn",type:"submit"},"Add")])
  ]));

  // filters
  var sel = h("select",{onchange:function(){ S.filter=sel.value; render(); }},[["open","Open tasks"],["overdue","Overdue"],["soon","Due in 7 days"],["done","Completed"],["all","All tasks"]].map(function(o){ return h("option",{value:o[0],selected:S.filter===o[0]},o[1]); }));
  var owners = Array.from(new Set(tasks.map(function(t){return t.owner;}).filter(Boolean))).sort();
  var osel = h("select",{onchange:function(){ S.ownerFilter=osel.value; render(); }},[h("option",{value:""},"All owners")].concat(owners.map(function(o){return h("option",{value:o,selected:S.ownerFilter===o},o);})));
  var csel = h("select",{onchange:function(){ S.catFilter=csel.value; render(); }},[h("option",{value:""},"All categories")].concat(cats.map(function(c){return h("option",{value:c,selected:S.catFilter===c},c);})));
  var shown = tasks.filter(function(t){
    var s = taskState(t);
    if (S.catFilter && t.category!==S.catFilter) return false;
    if (S.ownerFilter && t.owner!==S.ownerFilter) return false;
    if (S.filter==="open") return !t.done; if (S.filter==="done") return t.done;
    if (S.filter==="overdue") return s==="overdue"; if (S.filter==="soon") return s==="soon"; return true;
  });
  var list = h("div",{});
  if (!shown.length) list.appendChild(h("div",{class:"empty"},"No tasks match this filter."));
  shown.forEach(function(t){ list.appendChild(taskRow(t,false)); });
  root.appendChild(h("div",{class:"card"},[h("div",{class:"toolbar"},[h("h2",{style:"margin:0;margin-right:auto"},"Tasks"),sel,csel,osel]), list]));
}

// ---------- template
function renderTemplate(root){
  var rows = S.data.template;
  var tbody = h("tbody");
  rows.forEach(function(t){
    function inp(field, attrs){ var i=h("input",Object.assign({value:t[field]},attrs||{})); i.addEventListener("change",function(){ var b={}; b[field]=i.value; api("PATCH","/api/template/"+t.id,b).then(function(n){ Object.assign(t,n); toast("Saved"); }); }); return i; }
    tbody.appendChild(h("tr",{},[
      h("td",{},inp("title")), h("td",{style:"width:150px"},inp("category")),
      h("td",{style:"width:110px"},inp("offset_days",{type:"number"})),
      h("td",{style:"width:130px"},inp("owner")),
      h("td",{style:"width:40px"},h("button",{class:"btn ghost",title:"Remove",onclick:function(){ askConfirm("Remove “"+t.title+"” from the standard checklist? Existing events keep their copy.","Remove").then(function(ok){ if(ok) api("DELETE","/api/template/"+t.id).then(load).catch(function(e){toast(e.message);}); }); }},"✕"))
    ]));
  });
  var f = { title:h("input",{placeholder:"New standard task…"}), cat:h("input",{placeholder:"Category"}), off:h("input",{type:"number",placeholder:"-30"}), own:h("input",{placeholder:"Owner"}) };
  root.appendChild(h("div",{class:"card"},[
    h("h2",{},"Standard checklist"),
    h("p",{class:"muted",style:"margin-top:-4px"},"Every new event starts with these tasks. “Days from race” sets the due date: −30 means 30 days before race day, 7 means a week after. Changes here apply to new events; use “Sync standard list” on an event to pull in newly added tasks."),
    h("table",{class:"tmpl"},[h("thead",{},h("tr",{},[h("th",{},"Task"),h("th",{},"Category"),h("th",{},"Days from race"),h("th",{},"Default owner"),h("th",{})])), tbody]),
    h("form",{class:"form-row",style:"grid-template-columns:2fr 1fr 110px 130px auto;margin-top:12px",onsubmit:function(e){ e.preventDefault(); if(!f.title.value.trim())return;
      api("POST","/api/template",{title:f.title.value,category:f.cat.value,offset_days:f.off.value,owner:f.own.value}).then(function(){ toast("Added"); load(); }); }},
      [h("div",{},f.title),h("div",{},f.cat),h("div",{},f.off),h("div",{},f.own),h("button",{class:"btn",type:"submit"},"Add")])
  ]));
}

// ---------- dialogs
var dlg = document.getElementById("dlg");
function askConfirm(msg, okLabel){
  return new Promise(function(resolve){
    var d = document.getElementById("dlg2"); d.innerHTML = "";
    function done(v){ d.close(); resolve(v); }
    d.appendChild(h("div",{},[h("p",{style:"margin:0 0 6px"},msg),
      h("div",{class:"actions"},[h("button",{class:"btn secondary",type:"button",onclick:function(){done(false);}},"Cancel"),
        h("button",{class:"btn danger",type:"button",onclick:function(){done(true);}},okLabel||"Delete")])]));
    d.onclose = function(){ resolve(false); };
    d.showModal();
  });
}
function modal(title, fields, onSave, extra){
  dlg.innerHTML = "";
  var form = h("form",{method:"dialog",onsubmit:function(e){ e.preventDefault(); Promise.resolve(onSave()).then(function(ok){ if(ok!==false) dlg.close(); }).catch(function(err){ toast(err.message); }); }},
    [h("h2",{},title)].concat(fields.map(function(f){ return h("div",{class:"field"},[h("label",{},f[0]),f[1]]); }))
      .concat([h("div",{class:"actions"},[extra||null, h("span",{style:"flex:1"}), h("button",{class:"btn secondary",type:"button",onclick:function(){dlg.close();}},"Cancel"), h("button",{class:"btn",type:"submit"},"Save")])]));
  dlg.appendChild(form); dlg.showModal();
}
function openNewEvent(){
  var name=h("input",{required:true,placeholder:"e.g. Spring Criterium"}), date=h("input",{type:"date",required:true}), loc=h("input",{placeholder:"City, venue"}), notes=h("textarea",{rows:3});
  var useT=h("input",{type:"checkbox"}); useT.checked=true;
  modal("New race event",[["Event name",name],["Race date",date],["Location",loc],["Notes",notes],["Start from the standard checklist ("+S.data.template.length+" tasks)",useT]], function(){
    return api("POST","/api/events",{name:name.value,event_date:date.value,location:loc.value,notes:notes.value,apply_template:useT.checked}).then(function(ev){ toast("Event created"); return load().then(function(){ openEvent(ev.id); }); });
  });
}
function openEditEvent(ev){
  var name=h("input",{value:ev.name}), date=h("input",{type:"date",value:ev.event_date}), loc=h("input",{value:ev.location}), notes=h("textarea",{rows:3}); notes.value=ev.notes;
  var shift=h("input",{type:"checkbox"}); shift.checked=true;
  modal("Edit event",[["Event name",name],["Race date",date],["If the date changes, move open task due dates with it",shift],["Location",loc],["Notes",notes]], function(){
    return api("PATCH","/api/events/"+ev.id,{name:name.value,event_date:date.value,location:loc.value,notes:notes.value,shift_tasks:shift.checked}).then(function(){ toast("Saved"); return load(); });
  }, h("button",{class:"btn danger",type:"button",onclick:function(){ askConfirm("Delete “"+ev.name+"” and all its tasks? This cannot be undone.").then(function(ok){ if(ok) api("DELETE","/api/events/"+ev.id).then(function(){ dlg.close(); S.view="events"; location.hash="events"; load(); }).catch(function(e){toast(e.message);}); }); }},"Delete"));
}
function openTaskEditor(t){
  var title=h("input",{value:t.title}), due=h("input",{type:"date",value:t.due_date||""}), cat=h("input",{value:t.category}), owner=h("input",{value:t.owner}), notes=h("textarea",{rows:3}); notes.value=t.notes;
  modal("Edit task",[["Task",title],["Due date",due],["Category",cat],["Owner",owner],["Notes",notes]], function(){
    return api("PATCH","/api/tasks/"+t.id,{title:title.value,due_date:due.value,category:cat.value,owner:owner.value,notes:notes.value}).then(function(){ toast("Saved"); return load(); });
  }, h("button",{class:"btn danger",type:"button",onclick:function(){ askConfirm("Delete this task?").then(function(ok){ if(ok) api("DELETE","/api/tasks/"+t.id).then(function(){ dlg.close(); load(); }).catch(function(e){toast(e.message);}); }); }},"Delete"));
}

// ---------- login
function renderLogin(){
  app.innerHTML="";
  var pw=h("input",{type:"password",placeholder:"Password",autofocus:true});
  app.appendChild(h("div",{class:"card login"},[h("div",{style:"font-size:2rem"},"🏁"),h("h2",{},S.title||"Race Event To-Do"),
    h("form",{onsubmit:function(e){ e.preventDefault(); api("POST","/api/login",{password:pw.value}).then(boot).catch(function(err){ toast(err.message); }); }},
      [pw, h("button",{class:"btn",type:"submit",style:"width:100%;justify-content:center;margin-top:10px"},"Sign in")])]));
}

function boot(){
  api("GET","/api/me").then(function(me){
    S.passwordRequired = me.passwordRequired; S.title = me.title; document.title = me.title || document.title;
    if (!me.authed) return renderLogin();
    var m = location.hash.match(/^#event[-\/]([\w-]+)$/);
    if (m){ S.view="event"; S.eventId = /^\d+$/.test(m[1]) ? Number(m[1]) : m[1]; }
    else if (/^#(events|template)$/.test(location.hash)) S.view=location.hash.slice(1);
    return load();
  });
}
window.RACE_ON_REMOTE_CHANGE = function(){
  if (!S.data) return;
  var a = document.activeElement;
  if (document.querySelector("dialog[open]") || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && app.contains(a))) return;
  var y = window.scrollY; load().then(function(){ window.scrollTo(0,y); });
};
if (window.RACE_BACKEND_READY){ app.appendChild(h("div",{class:"empty",style:"padding:40px 0;text-align:center"},"Loading…")); window.RACE_BACKEND_READY.then(boot, boot); }
else boot();
</script>
