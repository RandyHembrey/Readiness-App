<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>USF Pro Championships · Event Readiness (demo)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<style>
  :root{
    --bg:#f6f6f3; --panel:#ffffff; --panel-2:#f0f0ec; --border:rgba(11,11,11,.10); --fg:#0b0b0b; --fg-2:#4a4a46; --muted:#6f6f69;
    --accent:#2a62d9; --accent-track:#d9e4fa; --grid:#e1e0d9; --axis:#c3c2b7;
    --good:#0ca30c; --good-text:#006300; --warning:#fab219; --critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111110; --panel:#1a1a19; --panel-2:#232321; --border:rgba(255,255,255,.10); --fg:#f3f3ef; --fg-2:#c8c8c2; --muted:#9a9a93;
      --accent:#5b8cf0; --accent-track:#24345a; --grid:#2c2c2a; --axis:#383835; --good-text:#0ca30c; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{max-width:1100px;margin:0 auto;padding:0 16px 64px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:18px}
  header h1{font-size:1.15rem;margin:0;margin-right:auto}
  nav{display:flex;gap:4px}
  nav button{background:none;border:none;color:var(--fg-2);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:.9rem}
  nav button.active{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--border);font-weight:600}
  h2{font-size:1rem;margin:0 0 10px}
  .muted{color:var(--muted);font-size:.85rem}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.88rem;cursor:pointer;white-space:nowrap}
  .btn.secondary{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--border)}
  .btn.ghost{background:none;color:var(--muted);padding:4px 8px}
  .btn.danger{background:var(--critical)}
  input,select,textarea{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel-2);color:var(--fg);width:100%}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--good);cursor:pointer;flex:none}
  label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:3px}
  .card{background:var(--panel);border-radius:12px;box-shadow:0 0 0 1px var(--border);padding:16px;margin-bottom:16px}
  .grid{display:grid;gap:12px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
  .tile{background:var(--panel);border-radius:12px;box-shadow:0 0 0 1px var(--border);padding:14px 16px}
  .tile .label{font-size:.8rem;color:var(--muted)}
  .tile .value{font-size:1.7rem;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .tile .sub{font-size:.78rem;color:var(--fg-2)}
  .two{grid-template-columns:1fr 1fr} @media (max-width:820px){.two{grid-template-columns:1fr}}
  .status{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;white-space:nowrap}
  .status.overdue{color:var(--critical)} .status.soon{color:var(--fg-2)} .status.done{color:var(--good-text)}
  .status .ico{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font-size:10px;color:#fff;line-height:1}
  .status.overdue .ico{background:var(--critical)} .status.soon .ico{background:var(--warning);color:#0b0b0b} .status.done .ico{background:var(--good)}
  .task{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--grid)}
  .task:first-child{border-top:none}
  .task .body{flex:1;min-width:0}
  .task .title{font-size:.92rem}
  .task.is-done .title{text-decoration:line-through;color:var(--muted)}
  .task .meta{font-size:.78rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
  .pill{font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--panel-2);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--border)}
  .event-row{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--grid);cursor:pointer}
  .event-row:first-of-type{border-top:none}
  .event-row:hover .ev-name{color:var(--accent)}
  .ev-name{font-weight:600}
  @media (max-width:600px){.event-row{grid-template-columns:1fr}}
  .meter{height:8px;border-radius:999px;background:var(--accent-track);overflow:hidden}
  .meter > span{display:block;height:100%;border-radius:999px;background:var(--accent)}
  .meter.complete > span{background:var(--good)}
  .meter-label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--fg-2);margin-top:5px;font-variant-numeric:tabular-nums}
  /* due-by-week bar chart */
  .chart{position:relative}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .chart .tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--border),0 4px 14px rgba(0,0,0,.15);border-radius:8px;padding:6px 9px;font-size:.78rem;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;display:none}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar select,.toolbar input{width:auto}
  .form-row{display:grid;gap:10px;grid-template-columns:2fr 1fr 1fr 1fr auto;align-items:end}
  @media (max-width:760px){.form-row{grid-template-columns:1fr 1fr}}
  .cat-head{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 2px;font-weight:600}
  dialog{border:none;border-radius:14px;background:var(--panel);color:var(--fg);padding:20px;width:min(520px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .field{margin-bottom:10px}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.85rem;display:none;z-index:10}
  .login{max-width:340px;margin:12vh auto;text-align:center}
  .empty{color:var(--muted);font-size:.88rem;padding:8px 0}
  table.tmpl{width:100%;border-collapse:collapse;font-size:.88rem}
  table.tmpl td,table.tmpl th{padding:6px 6px;border-top:1px solid var(--grid);text-align:left;vertical-align:middle}
  table.tmpl th{font-size:.75rem;color:var(--muted);font-weight:600;border-top:none}
  table.tmpl input{padding:5px 7px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .timing{display:flex;gap:6px;align-items:center}
  .timing select{width:auto;flex:none}
  .timing input[type=number]{width:72px;flex:none}
  .timing input[type=date]{width:150px;flex:none}
  .seg{display:inline-flex;background:var(--panel-2);border-radius:9px;padding:3px;box-shadow:inset 0 0 0 1px var(--border)}
  .seg button{background:none;border:none;color:var(--fg-2);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:.86rem}
  .seg button.active{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--border)}
  .pill.std{background:rgba(42,98,217,.10);color:var(--accent)}
  .pill.adhoc{background:rgba(250,178,25,.18);color:var(--fg-2)}
  table.manage td.due{white-space:nowrap;color:var(--muted);font-size:.8rem;width:70px}
  tr.done-row input{color:var(--muted);text-decoration:line-through}
  .pick-list{max-height:50vh;overflow:auto;margin:8px 0}
  .pick-list label{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--fg);padding:5px 0;border-top:1px solid var(--grid);margin:0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<script>
// Browser implementation of the server.js API, over a pluggable document store.
// Used by the offline demo (localStorage) and the hosted mock-up (shared realtime store).
// store: { all(coll) -> rows, get(coll, id) -> row|undefined, put(coll, row) -> Promise, del(coll, id) -> Promise, newId(prefix) }
// Collections: template, events, tasks. Task lead time: offset_days relative to race day (null = fixed due_date);
// template_id null = ad-hoc task.
window.RACE_MAKE_CORE = function (store, opts) {
  opts = opts || {};
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(s, n) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + Number(n || 0)); return ymd(d); }
  function intOrNull(v) { return v === null || v === '' || v === undefined || !isFinite(Number(v)) ? null : Math.trunc(Number(v)); }
  function isYmd(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function str(v, n) { return (v == null ? '' : String(v)).slice(0, n || 2000).trim(); }
  function pick(o, b, k) { return b[k] !== undefined ? b[k] : o[k]; }
  function byDue(a, b) { var x = a.due_date || '9999', y = b.due_date || '9999'; return x < y ? -1 : x > y ? 1 : (a.sort_order || 0) - (b.sort_order || 0); }
  function template() { return store.all('template').sort(function (a, b) { return a.offset_days - b.offset_days || (a.sort_order || 0) - (b.sort_order || 0); }); }
  function tasksOf(evId) { return store.all('tasks').filter(function (t) { return t.event_id === evId; }); }
  async function inBatches(items, n, fn) { for (var i = 0; i < items.length; i += n) await Promise.all(items.slice(i, i + n).map(fn)); }
  function fromTemplate(ev, t, i) {
    return { id: store.newId('t'), event_id: ev.id, title: t.title, category: t.category, due_date: addDays(ev.event_date, t.offset_days),
      offset_days: t.offset_days, template_id: t.id, owner: t.owner || '', notes: t.notes || '', sort_order: i, done: 0, done_at: null };
  }
  function linked(tasks, t) {
    return tasks.filter(function (x) { return x.template_id === t.id || (x.template_id == null && String(x.title).toLowerCase() === String(t.title).toLowerCase()); });
  }
  async function syncEvent(ev, templateIds, updateExisting) {
    var tasks = tasksOf(ev.id), adds = [], ups = [];
    template().forEach(function (t, i) {
      if (templateIds && templateIds.indexOf(t.id) === -1) return;
      var l = linked(tasks, t);
      if (!l.length) { adds.push(fromTemplate(ev, t, i)); return; }
      if (!updateExisting) return;
      l.filter(function (x) { return !x.done; }).forEach(function (x) {
        var due = addDays(ev.event_date, t.offset_days);
        if (x.title !== t.title || x.category !== t.category || x.owner !== (t.owner || '') || x.offset_days !== t.offset_days || x.due_date !== due || x.template_id !== t.id)
          ups.push(Object.assign({}, x, { title: t.title, category: t.category, owner: t.owner || '', offset_days: t.offset_days, due_date: due, template_id: t.id }));
      });
    });
    await inBatches(adds.concat(ups), 8, function (r) { return store.put('tasks', r); });
    return { added: adds.length, updated: ups.length };
  }

  async function handle(method, url, b) {
    b = b || {};
    var m;
    if (url === '/api/me') return { authed: true, passwordRequired: false, title: opts.title || 'Race Event To-Do' };
    if (url === '/api/logout') return { ok: true };
    if (url === '/api/state') {
      var evs = store.all('events'), byId = {};
      evs.forEach(function (e) { byId[e.id] = e; });
      return {
        events: evs.sort(function (a, c) { return (a.archived || 0) - (c.archived || 0) || (a.event_date < c.event_date ? -1 : 1); }),
        tasks: store.all('tasks').filter(function (t) { return byId[t.event_id]; }).sort(byDue)
          .map(function (t) { return Object.assign({ offset_days: null, template_id: null, notes: '', owner: '' }, t, { event_name: byId[t.event_id].name, event_date: byId[t.event_id].event_date }); }),
        template: template(),
      };
    }
    if (method === 'POST' && url === '/api/events') {
      if (!str(b.name) || !isYmd(b.event_date)) throw new Error('Name and event date are required');
      var ev = { id: store.newId('e'), name: str(b.name, 200), event_date: b.event_date, location: str(b.location, 200), notes: str(b.notes), archived: 0, created_at: new Date().toISOString() };
      await store.put('events', ev);
      if (b.apply_template !== false) await inBatches(template().map(function (t, i) { return fromTemplate(ev, t, i); }), 8, function (r) { return store.put('tasks', r); });
      return ev;
    }
    if ((m = url.match(/^\/api\/events\/([\w-]+)\/tasks$/))) {
      var e0 = store.get('events', m[1]);
      if (!e0) throw new Error('Event not found');
      if (!str(b.title)) throw new Error('Title is required');
      var off = intOrNull(b.offset_days);
      var t = { id: store.newId('t'), event_id: e0.id, title: str(b.title, 300), category: str(b.category, 80) || 'General',
        offset_days: off, due_date: off != null ? addDays(e0.event_date, off) : (isYmd(b.due_date) ? b.due_date : null),
        template_id: null, owner: str(b.owner, 100), notes: str(b.notes), sort_order: 999, done: 0, done_at: null };
      await store.put('tasks', t); return t;
    }
    if ((m = url.match(/^\/api\/events\/([\w-]+)\/apply-template$/))) {
      var ids = Array.isArray(b.template_ids) ? b.template_ids : null;
      return syncEvent(store.get('events', m[1]), ids, !!b.update_existing);
    }
    if ((m = url.match(/^\/api\/events\/([\w-]+)$/))) {
      var id = m[1], e = store.get('events', id);
      if (!e) throw new Error('Not found');
      if (method === 'DELETE') {
        var mine = tasksOf(id);
        await store.del('events', id);
        await inBatches(mine, 8, function (x) { return store.del('tasks', x.id); });
        return { ok: true };
      }
      var n = Object.assign({}, e);
      if (b.name !== undefined) n.name = str(b.name, 200) || e.name;
      if (b.location !== undefined) n.location = str(b.location, 200);
      if (b.notes !== undefined) n.notes = str(b.notes);
      if (isYmd(b.event_date)) n.event_date = b.event_date;
      if (b.archived !== undefined) n.archived = b.archived ? 1 : 0;
      await store.put('events', n);
      if (n.event_date !== e.event_date) {
        var delta = Math.round((Date.parse(n.event_date) - Date.parse(e.event_date)) / 864e5), moves = [];
        tasksOf(id).forEach(function (x) {
          if (x.done) return;
          if (x.offset_days != null) moves.push(Object.assign({}, x, { due_date: addDays(n.event_date, x.offset_days) }));
          else if (b.shift_tasks && x.due_date) moves.push(Object.assign({}, x, { due_date: addDays(x.due_date, delta) }));
        });
        await inBatches(moves, 8, function (r) { return store.put('tasks', r); });
      }
      return n;
    }
    if ((m = url.match(/^\/api\/tasks\/([\w-]+)$/))) {
      var tk = store.get('tasks', m[1]);
      if (!tk) throw new Error('Not found');
      if (method === 'DELETE') { await store.del('tasks', tk.id); return { ok: true }; }
      var ev2 = store.get('events', tk.event_id), nt = Object.assign({}, tk);
      if (b.title !== undefined) nt.title = str(b.title, 300) || tk.title;
      if (b.category !== undefined) nt.category = str(b.category, 80) || 'General';
      if (b.owner !== undefined) nt.owner = str(b.owner, 100);
      if (b.notes !== undefined) nt.notes = str(b.notes);
      if (b.offset_days !== undefined && intOrNull(b.offset_days) != null) { nt.offset_days = intOrNull(b.offset_days); nt.due_date = addDays(ev2.event_date, nt.offset_days); }
      else if (b.offset_days !== undefined || b.due_date !== undefined) { nt.offset_days = null; if (b.due_date !== undefined) nt.due_date = isYmd(b.due_date) ? b.due_date : null; }
      if (b.done !== undefined) { nt.done_at = b.done ? (tk.done ? tk.done_at : new Date().toISOString()) : null; nt.done = b.done ? 1 : 0; }
      await store.put('tasks', nt); return nt;
    }
    if (method === 'POST' && url === '/api/template') {
      if (!str(b.title)) throw new Error('Title is required');
      var tt = { id: store.newId('s'), title: str(b.title, 300), category: str(b.category, 80) || 'General', offset_days: intOrNull(b.offset_days) || 0, owner: str(b.owner, 100), notes: '', sort_order: 999 };
      await store.put('template', tt); return tt;
    }
    if ((m = url.match(/^\/api\/template\/([\w-]+)$/))) {
      var o = store.get('template', m[1]);
      if (!o) throw new Error('Not found');
      if (method === 'DELETE') { await store.del('template', o.id); return { ok: true }; }
      var nn = Object.assign({}, o);
      ['title', 'category', 'owner', 'notes'].forEach(function (k) { nn[k] = b[k] !== undefined ? str(b[k], 300) : o[k]; });
      if (!nn.title) nn.title = o.title;

<script>
// Offline demo backend: the core API over localStorage, preloaded with a mock season.
window.RACE_MAKE_LOCAL_API = function () {
  var KEY = 'race-todo-demo-v2', SEED = window.RACE_SEED;
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(s, n) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + Number(n || 0)); return ymd(d); }
  var seq = 1;
  function fresh() {
    var data = { template: {}, events: {}, tasks: {} }, tmpl = [];
    SEED.TEMPLATE.forEach(function (t, i) { var r = { id: 's' + (seq++), category: t[0], offset_days: t[1], title: t[2], owner: t[3] || '', notes: '', sort_order: i }; data.template[r.id] = r; tmpl.push(r); });
    tmpl.sort(function (a, b) { return a.offset_days - b.offset_days || a.sort_order - b.sort_order; });
    var today = ymd(new Date()), soon = addDays(today, 21);
    SEED.DEMO_EVENTS.forEach(function (e, ei) {
      var ev = { id: 'e' + (seq++), name: e.name, event_date: addDays(today, e.inDays), location: e.location, notes: e.notes, archived: 0 };
      data.events[ev.id] = ev;
      tmpl.forEach(function (t, i) {
        var due = addDays(ev.event_date, t.offset_days), h = (ei * 31 + i * 17) % 100;
        var done = due < today ? h < e.done * 100 : (due < soon && h < 25);
        var r = { id: 't' + (seq++), event_id: ev.id, title: t.title, category: t.category, due_date: due, offset_days: t.offset_days, template_id: t.id, owner: t.owner, notes: '', sort_order: i, done: done ? 1 : 0, done_at: done ? new Date().toISOString() : null };
        data.tasks[r.id] = r;
      });
    });
    return data;
  }
  var data;
  try { data = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!data) data = fresh();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  save();
  window.RACE_DEMO_RESET = function () { data = fresh(); save(); location.hash = ''; location.reload(); };
  var store = {
    all: function (c) { return Object.keys(data[c]).map(function (k) { return Object.assign({}, data[c][k]); }); },
    get: function (c, id) { return data[c][id] && Object.assign({}, data[c][id]); },
    put: function (c, row) { data[c][row.id] = JSON.parse(JSON.stringify(row)); save(); return Promise.resolve(); },
    del: function (c, id) { delete data[c][id]; save(); return Promise.resolve(); },
    newId: function (p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); },
  };
  return window.RACE_MAKE_CORE(store, { title: 'USF Pro Championships · Event Readiness (demo)' });
};
if (!window.RACE_DEFER_BACKEND) window.RACE_DEMO_API = window.RACE_MAKE_LOCAL_API();

// ---------- per-event control panel
function renderManage(root, ev, tasks, cats){

  function isStandard(x){ return x.template_id!=null || tmpl.some(function(t){ return isLinked(x,t); }); }
  var missing = tmpl.filter(function(t){ return !tasks.some(function(x){ return isLinked(x,t); }); });
  var rows = tasks.slice().sort(function(a,b){ return (a.due_date||"9999")<(b.due_date||"9999")?-1:(a.due_date||"9999")>(b.due_date||"9999")?1:0; });
  var nStd = rows.filter(isStandard).length;

  function patch(t, body){ return api("PATCH","/api/tasks/"+t.id, body).then(function(n){ Object.assign(t, n); toast("Saved"); return load(); }).catch(function(e){ toast(e.message); }); }

  rows.forEach(function(t){
    function inp(field, attrs){ var i=h("input",Object.assign({value:t[field]||""},attrs||{})); i.addEventListener("change",function(){ var b={}; b[field]=i.value; patch(t,b); }); return i; }

    onChangeAll(tc.inputs, function(){ var v=tc.value(); if (v.offset_days===null && !v.due_date) return; patch(t, v); });
    var std = isStandard(t);
    tbody.appendChild(h("tr",{class:t.done?"done-row":""},[
      h("td",{},inp("title",{"aria-label":"Task"})),
      h("td",{style:"width:140px"},inp("category",{list:"cats","aria-label":"Category"})),
      h("td",{style:"width:300px"},tc.el),
      h("td",{class:"due"},fmtDate(t.due_date)),
      h("td",{style:"width:120px"},inp("owner",{"aria-label":"Owner"})),
      h("td",{style:"width:80px"},h("span",{class:"pill "+(std?"std":"adhoc"),title:std?"From the standard checklist":"Added for this event only"},std?"Standard":"Ad-hoc")),
      h("td",{style:"width:40px"},h("button",{class:"btn ghost",title:"Remove from this event",onclick:function(){ askConfirm("Remove “"+t.title+"” from "+ev.name+"?"+(std?" (It stays on the standard checklist.)":""),"Remove").then(function(ok){ if(ok) api("DELETE","/api/tasks/"+t.id).then(load).catch(function(e){toast(e.message);}); }); }},"✕"))
    ]));
  });

  // ad-hoc add row
  var nt = { title:h("input",{id:"adhoc-title",placeholder:"New ad-hoc task for this event…"}), cat:h("input",{placeholder:"Category",list:"cats"}), owner:h("input",{placeholder:"Owner"}) };
  var ntc = timingControl(-14, null, true);
  var addForm = h("form",{style:"display:grid;grid-template-columns:1fr 140px 300px 120px auto;gap:8px;align-items:center;margin-top:12px",onsubmit:function(e){
      e.preventDefault(); if(!nt.title.value.trim()) return;
      var v = ntc.value(); if (v.offset_days===null && !v.due_date) return toast("Pick a due date");
      api("POST","/api/events/"+ev.id+"/tasks",Object.assign({title:nt.title.value,category:nt.cat.value,owner:nt.owner.value},v)).then(function(){ toast("Task added"); return load(); }).then(function(){ var i=document.getElementById("adhoc-title"); if(i) i.focus(); }).catch(function(e){toast(e.message);}); }},
    [nt.title, nt.cat, ntc.el, nt.owner, h("button",{class:"btn",type:"submit"},"Add")]);

  root.appendChild(h("div",{class:"card"},[
    h("datalist",{id:"cats"}, Array.from(new Set(cats.concat(tmpl.map(function(t){return t.category;})))).sort().map(function(c){return h("option",{value:c});})),
    h("div",{class:"toolbar"},[
      h("h2",{style:"margin:0;margin-right:auto"},"Manage tasks · "+rows.length+" ("+nStd+" standard, "+(rows.length-nStd)+" ad-hoc)"),
      h("button",{class:"btn secondary",disabled:!missing.length,onclick:function(){ openAddStandard(ev, missing); }}, missing.length ? "Add standard tasks ("+missing.length+")" : "All standard tasks added"),
      h("button",{class:"btn secondary",title:"Bring open standard tasks in line with the standard checklist",onclick:function(){
        askConfirm("Update this event from the standard checklist? Open standard tasks take the checklist’s current wording, category, owner and lead time, and any missing standard tasks are added. Completed tasks, ad-hoc tasks and your removals of other tasks are left alone.","Update").then(function(ok){ if(!ok) return;
          api("POST","/api/events/"+ev.id+"/apply-template",{update_existing:true}).then(function(r){ toast(r.added+" added, "+r.updated+" updated"); load(); }).catch(function(e){toast(e.message);}); }); }},"Update from standard")
    ]),
    h("p",{class:"muted",style:"margin:-4px 0 6px"},"Edit anything inline; changes save as you go. Lead times count from race day, so moving the race date moves these due dates with it. Use “fixed date” for a deadline that doesn’t depend on the race."),
    h("div",{style:"overflow-x:auto"},h("table",{class:"tmpl manage"},[h("thead",{},h("tr",{},["Task","Category","Due (lead time)","","Owner","Type",""].map(function(x){return h("th",{},x);}))), tbody])),

      var ids = boxes.filter(function(b){return b.c.checked;}).map(function(b){return b.t.id;});

            .then(function(){ toast(a+" added, "+u+" updated across "+evs.length+" event(s)"); load(); }).catch(function(e){ toast(e.message); }); }); }},"Apply to upcoming events")

// ---------- login
function renderLogin(){
  app.innerHTML="";
  var pw=h("input",{type:"password",placeholder:"Password",autofocus:true});
  app.appendChild(h("div",{class:"card login"},[h("div",{style:"font-size:2rem"},"🏁"),h("h2",{},S.title||"Race Event To-Do"),
    h("form",{onsubmit:function(e){ e.preventDefault(); api("POST","/api/login",{password:pw.value}).then(boot).catch(function(err){ toast(err.message); }); }},
      [pw, h("button",{class:"btn",type:"submit",style:"width:100%;justify-content:center;margin-top:10px"},"Sign in")])]));

function boot(){
  api("GET","/api/me").then(function(me){
    S.passwordRequired = me.passwordRequired; S.title = me.title; document.title = me.title || document.title;
    if (!me.authed) return renderLogin();
    var m = location.hash.match(/^#event[-\/]([\w-]+)$/);
    if (m){ S.view="event"; S.eventId = /^\d+$/.test(m[1]) ? Number(m[1]) : m[1]; }
    else if (/^#(events|template)$/.test(location.hash)) S.view=location.hash.slice(1);
    return load();
  });
}
window.RACE_ON_REMOTE_CHANGE = function(){
  if (!S.data) return;
  var a = document.activeElement;
  if (document.querySelector("dialog[open]") || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && app.contains(a))) return;
  var y = window.scrollY; load().then(function(){ window.scrollTo(0,y); });
};
if (window.RACE_BACKEND_READY){ app.appendChild(h("div",{class:"empty",style:"padding:40px 0;text-align:center"},"Loading…")); window.RACE_BACKEND_READY.then(boot, boot); }
else boot();
