<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Race Event To-Do</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<style>
  :root{
    --bg:#f6f6f3; --panel:#ffffff; --panel-2:#f0f0ec; --border:rgba(11,11,11,.10); --fg:#0b0b0b; --fg-2:#4a4a46; --muted:#6f6f69;
    --accent:#2a62d9; --accent-track:#d9e4fa; --grid:#e1e0d9; --axis:#c3c2b7;
    --good:#0ca30c; --good-text:#006300; --warning:#fab219; --critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111110; --panel:#1a1a19; --panel-2:#232321; --border:rgba(255,255,255,.10); --fg:#f3f3ef; --fg-2:#c8c8c2; --muted:#9a9a93;
      --accent:#5b8cf0; --accent-track:#24345a; --grid:#2c2c2a; --axis:#383835; --good-text:#0ca30c; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{max-width:1100px;margin:0 auto;padding:0 16px 64px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:18px}
  header h1{font-size:1.15rem;margin:0;margin-right:auto}
  nav{display:flex;gap:4px}
  nav button{background:none;border:none;color:var(--fg-2);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:.9rem}
  nav button.active{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--border);font-weight:600}
  h2{font-size:1rem;margin:0 0 10px}
  .muted{color:var(--muted);font-size:.85rem}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.88rem;cursor:pointer;white-space:nowrap}
  .btn.secondary{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--border)}
  .btn.ghost{background:none;color:var(--muted);padding:4px 8px}
  .btn.danger{background:var(--critical)}
  input,select,textarea{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel-2);color:var(--fg);width:100%}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--good);cursor:pointer;flex:none}
  label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:3px}
  .card{background:var(--panel);border-radius:12px;box-shadow:0 0 0 1px var(--border);padding:16px;margin-bottom:16px}
  .grid{display:grid;gap:12px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
  .tile{background:var(--panel);border-radius:12px;box-shadow:0 0 0 1px var(--border);padding:14px 16px}
  .tile .label{font-size:.8rem;color:var(--muted)}
  .tile .value{font-size:1.7rem;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .tile .sub{font-size:.78rem;color:var(--fg-2)}
  .two{grid-template-columns:1fr 1fr} @media (max-width:820px){.two{grid-template-columns:1fr}}
  .status{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;white-space:nowrap}
  .status.overdue{color:var(--critical)} .status.soon{color:var(--fg-2)} .status.done{color:var(--good-text)}
  .status .ico{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font-size:10px;color:#fff;line-height:1}
  .status.overdue .ico{background:var(--critical)} .status.soon .ico{background:var(--warning);color:#0b0b0b} .status.done .ico{background:var(--good)}
  .task{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--grid)}
  .task:first-child{border-top:none}
  .task .body{flex:1;min-width:0}
  .task .title{font-size:.92rem}
  .task.is-done .title{text-decoration:line-through;color:var(--muted)}
  .task .meta{font-size:.78rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
  .pill{font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--panel-2);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--border)}
  .event-row{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--grid);cursor:pointer}
  .event-row:first-of-type{border-top:none}
  .event-row:hover .ev-name{color:var(--accent)}
  .ev-name{font-weight:600}
  @media (max-width:600px){.event-row{grid-template-columns:1fr}}
  .meter{height:8px;border-radius:999px;background:var(--accent-track);overflow:hidden}
  .meter > span{display:block;height:100%;border-radius:999px;background:var(--accent)}
  .meter.complete > span{background:var(--good)}
  .meter-label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--fg-2);margin-top:5px;font-variant-numeric:tabular-nums}
  /* due-by-week bar chart */
  .chart{position:relative}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .chart .tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--border),0 4px 14px rgba(0,0,0,.15);border-radius:8px;padding:6px 9px;font-size:.78rem;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;display:none}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar select,.toolbar input{width:auto}
  .form-row{display:grid;gap:10px;grid-template-columns:2fr 1fr 1fr 1fr auto;align-items:end}
  @media (max-width:760px){.form-row{grid-template-columns:1fr 1fr}}
  .cat-head{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 2px;font-weight:600}
  dialog{border:none;border-radius:14px;background:var(--panel);color:var(--fg);padding:20px;width:min(520px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .field{margin-bottom:10px}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.85rem;display:none;z-index:10}
  .login{max-width:340px;margin:12vh auto;text-align:center}
  .empty{color:var(--muted);font-size:.88rem;padding:8px 0}
  table.tmpl{width:100%;border-collapse:collapse;font-size:.88rem}
  table.tmpl td,table.tmpl th{padding:6px 6px;border-top:1px solid var(--grid);text-align:left;vertical-align:middle}
  table.tmpl th{font-size:.75rem;color:var(--muted);font-weight:600;border-top:none}
  table.tmpl input{padding:5px 7px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<script>
"use strict";
var S = { view: "dashboard", eventId: null, data: null, filter: "open", catFilter: "" };
var app = document.getElementById("app");

// ---------- utils
function h(tag, attrs, kids){
  var el = document.createElement(tag);
  for (var k in (attrs||{})) {
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  [].concat(kids == null ? [] : kids).forEach(function(c){
    if (c == null || c === false) return;
    el.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  });
  return el;
}
function api(method, url, body){
  return fetch(url, { method: method, headers: body ? {"Content-Type":"application/json"} : {}, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" })
    .then(function(r){ return r.json().then(function(j){ if(!r.ok){ if(r.status===401){ renderLogin(); } throw new Error(j.error||r.statusText);} return j; }); });
}
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display="none";},2400); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysBetween(a,b){ return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/864e5); }
function fmtDate(ymd){ if(!ymd) return "No date"; var d=new Date(ymd+"T12:00:00"); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year: d.getFullYear()===new Date().getFullYear()?undefined:"numeric"}); }
function relDays(n){ if(n===0) return "today"; if(n===1) return "tomorrow"; if(n===-1) return "yesterday"; return n>0 ? "in "+n+" days" : Math.abs(n)+" days ago"; }
function taskState(t){
  if (t.done) return "done";
  if (!t.due_date) return "open";
  var n = daysBetween(today(), t.due_date);
  if (n < 0) return "overdue";
  if (n <= 7) return "soon";
  return "open";
}
function statusChip(t){
  var st = taskState(t);
  if (st==="overdue") return h("span",{class:"status overdue"},[h("span",{class:"ico","aria-hidden":"true"},"!"),"Overdue "+Math.abs(daysBetween(today(),t.due_date))+"d"]);
  if (st==="soon") return h("span",{class:"status soon"},[h("span",{class:"ico","aria-hidden":"true"},"•"),"Due "+relDays(daysBetween(today(),t.due_date))]);
  if (st==="done") return h("span",{class:"status done"},[h("span",{class:"ico","aria-hidden":"true"},"✓"),"Done"]);
  return null;
}
function eventStats(evId){
  var ts = S.data.tasks.filter(function(t){ return t.event_id===evId; });
  var done = ts.filter(function(t){return t.done;}).length;
  return { total: ts.length, done: done, overdue: ts.filter(function(t){return taskState(t)==="overdue";}).length,
           soon: ts.filter(function(t){return taskState(t)==="soon";}).length, pct: ts.length ? Math.round(done*100/ts.length) : 0 };
}
function activeEvents(){ return S.data.events.filter(function(e){ return !e.archived; }); }

// ---------- data
function load(){ return api("GET","/api/state").then(function(d){ S.data=d; render(); }); }
function toggleTask(t, done){
  return api("PATCH","/api/tasks/"+t.id,{done:done}).then(function(nt){
    var i=S.data.tasks.findIndex(function(x){return x.id===t.id;}); Object.assign(S.data.tasks[i], nt); render();
  }).catch(function(e){ toast(e.message); });
}

// ---------- shell
function render(){
  app.innerHTML = "";
  var tabs = [["dashboard","Dashboard"],["events","Events"],["template","Standard checklist"]];
  app.appendChild(h("header",{},[
    h("h1",{},"🏁 Race Event To-Do"),
    h("nav",{}, tabs.map(function(t){ return h("button",{class: (S.view===t[0] || (S.view==="event"&&t[0]==="events")) ? "active":"", onclick:function(){ S.view=t[0]; S.eventId=null; location.hash=t[0]; render(); }}, t[1]); })),
    h("button",{class:"btn",onclick:openNewEvent},"+ New event"),
    S.passwordRequired ? h("button",{class:"btn ghost",onclick:function(){ api("POST","/api/logout").then(renderLogin); }},"Sign out") : null
  ]));
  var main = h("main");
  app.appendChild(main);
  if (S.view==="dashboard") renderDashboard(main);
  else if (S.view==="events") renderEvents(main);
  else if (S.view==="event") renderEvent(main);
  else if (S.view==="template") renderTemplate(main);
}

// ---------- dashboard
function renderDashboard(root){
  var evs = activeEvents();
  var evIds = new Set(evs.map(function(e){return e.id;}));
  var tasks = S.data.tasks.filter(function(t){ return evIds.has(t.event_id); });
  var done = tasks.filter(function(t){return t.done;}).length;
  var overdue = tasks.filter(function(t){return taskState(t)==="overdue";});
  var soon = tasks.filter(function(t){return taskState(t)==="soon";});
  var upcoming = evs.filter(function(e){ return daysBetween(today(),e.event_date)>=0; }).sort(function(a,b){return a.event_date<b.event_date?-1:1;});
  var next = upcoming[0];

  root.appendChild(h("div",{class:"grid tiles"},[
    tile("Active events", evs.length, upcoming.length+" upcoming"),
    tile("Next race", next ? relDays(daysBetween(today(),next.event_date)).replace(/^in /,"") : "—", next ? next.name+" · "+fmtDate(next.event_date) : "No upcoming events"),
    tile("Complete", tasks.length ? Math.round(done*100/tasks.length)+"%" : "—", done+" of "+tasks.length+" tasks"),
    tile("Overdue", overdue.length, overdue.length ? "needs attention" : "all caught up"),
    tile("Due in 7 days", soon.length, "across "+new Set(soon.map(function(t){return t.event_id;})).size+" events")
  ]));

  if (!evs.length){
    root.appendChild(h("div",{class:"card"},[h("h2",{},"Welcome!"),h("p",{class:"muted"},"Create your first race event — it will automatically get the standard checklist with due dates counted back from race day. You can edit that standard list under “Standard checklist”."),h("button",{class:"btn",onclick:openNewEvent},"+ New event")]));
    return;
  }

  // open tasks due per week
  root.appendChild(h("div",{class:"card"},[
    h("h2",{},"Open tasks by due week"),
    h("div",{class:"muted",style:"margin:-6px 0 8px"},"Next 12 weeks, all active events"),
    dueChart(tasks)
  ]));

  var attention = overdue.concat(soon).sort(function(a,b){ return (a.due_date||"9")<(b.due_date||"9")?-1:1; });
  root.appendChild(h("div",{class:"grid two"},[
    h("div",{class:"card"},[h("h2",{},"Needs attention"),
      attention.length ? h("div",{}, attention.slice(0,25).map(function(t){ return taskRow(t,true); })) : h("div",{class:"empty"},"Nothing overdue or due this week. 🎉"),
      attention.length>25 ? h("div",{class:"muted"},"+"+(attention.length-25)+" more") : null]),
    h("div",{class:"card"},[h("h2",{},"Event progress"), h("div",{}, evs.slice().sort(function(a,b){return a.event_date<b.event_date?-1:1;}).map(eventRow))])
  ]));
}
function tile(label, value, sub){ return h("div",{class:"tile"},[h("div",{class:"label"},label),h("div",{class:"value"},String(value)),h("div",{class:"sub"},sub)]); }

function dueChart(tasks){
  var t0 = today(), weeks = 12;
  var open = tasks.filter(function(t){ return !t.done && t.due_date; });
  var buckets = [{label:"Overdue", n:0, overdue:true}];
  var start = new Date(t0+"T12:00:00"); start.setDate(start.getDate()-((start.getDay()+6)%7)); // Monday of this week
  for (var i=0;i<weeks;i++){ var d=new Date(start); d.setDate(d.getDate()+i*7); buckets.push({ start:d, label: d.toLocaleDateString(undefined,{month:"short",day:"numeric"}), n:0 }); }
  open.forEach(function(t){
    if (t.due_date < t0) { buckets[0].n++; return; }
    var mon = buckets[1].start; var ms = mon.getFullYear()+"-"+String(mon.getMonth()+1).padStart(2,"0")+"-"+String(mon.getDate()).padStart(2,"0");
    var idx = Math.floor(daysBetween(ms, t.due_date)/7);
    if (idx>=0 && idx<weeks) buckets[idx+1].n++;
  });
  var W=720, H=200, padL=28, padB=26, padT=10, n=buckets.length, gap=2;
  var max = Math.max(4, Math.max.apply(null, buckets.map(function(b){return b.n;})));
  var step = Math.ceil(max/4); max = step*4;
  var bw = (W-padL)/n;
  var ns="http://www.w3.org/2000/svg";
  function s(tag, a){ var el=document.createElementNS(ns,tag); for (var k in a) el.setAttribute(k,a[k]); return el; }
  var svg = s("svg",{viewBox:"0 0 "+W+" "+H, role:"img","aria-label":"Open tasks by due week"});
  for (var g=0; g<=4; g++){
    var y = padT + (H-padT-padB)*(1-g/4);
    svg.appendChild(s("line",{x1:padL,x2:W,y1:y,y2:y,stroke: g===0 ? "var(--axis)" : "var(--grid)","stroke-width":1}));
    var tl=s("text",{x:padL-6,y:y+4,"text-anchor":"end","font-size":11,fill:"var(--muted)"}); tl.textContent=g*step; svg.appendChild(tl);
  }
  var wrap = h("div",{class:"chart"}); var tip = h("div",{class:"tip"});
  buckets.forEach(function(b,i){
    var x = padL + i*bw + gap, w = Math.max(4, bw - gap*2 - 8), bh = (H-padT-padB)*(b.n/max), y = H-padB-bh;
    var bx = x + (bw-gap*2-w)/2;
    if (b.n>0){
      var r = Math.min(4, bh);
      var p = "M"+bx+","+(H-padB)+" V"+(y+r)+" Q"+bx+","+y+" "+(bx+r)+","+y+" H"+(bx+w-r)+" Q"+(bx+w)+","+y+" "+(bx+w)+","+(y+r)+" V"+(H-padB)+" Z";
      svg.appendChild(s("path",{d:p, fill: b.overdue ? "var(--critical)" : "var(--accent)"}));
    }
    var lab = s("text",{x:bx+w/2,y:H-8,"text-anchor":"middle","font-size":11,fill: b.overdue ? "var(--critical)" : "var(--muted)","font-weight": b.overdue?600:400}); lab.textContent = b.overdue ? "⚠ Overdue" : (i%2===0 ? b.label : ""); svg.appendChild(lab);
    var hit = s("rect",{x:padL+i*bw,y:padT,width:bw,height:H-padT-padB,fill:"transparent",style:"cursor:default"});
    hit.addEventListener("mouseenter",function(){ tip.style.display="block"; tip.textContent=(b.overdue?"Overdue":"Week of "+b.label)+": "+b.n+" open task"+(b.n===1?"":"s"); tip.style.left=((bx+w/2)/W*100)+"%"; tip.style.top=(y/H*100)+"%"; });
    hit.addEventListener("mouseleave",function(){ tip.style.display="none"; });
    svg.appendChild(hit);
  });
  wrap.appendChild(svg); wrap.appendChild(tip);
  // accessible table view
  var tbl = h("table",{class:"sr"},[h("tr",{},[h("th",{},"Week"),h("th",{},"Open tasks")])].concat(buckets.map(function(b){ return h("tr",{},[h("td",{},b.overdue?"Overdue":"Week of "+b.label),h("td",{},String(b.n))]); })));
  wrap.appendChild(tbl);
  return wrap;
}

function eventRow(ev){
  var st = eventStats(ev.id), dd = daysBetween(today(), ev.event_date);
  return h("div",{class:"event-row",onclick:function(){ openEvent(ev.id); }},[
    h("div",{},[h("div",{class:"ev-name"},ev.name),
      h("div",{class:"muted"},[fmtDate(ev.event_date)+" · "+(dd>=0 ? relDays(dd) : "past"), ev.location ? " · "+ev.location : ""]),
      st.overdue ? h("span",{class:"status overdue"},[h("span",{class:"ico","aria-hidden":"true"},"!"), st.overdue+" overdue"]) : null]),
    h("div",{},[h("div",{class:"meter"+(st.pct===100?" complete":""),role:"progressbar","aria-valuenow":st.pct,"aria-valuemin":0,"aria-valuemax":100},h("span",{style:"width:"+st.pct+"%"})),
      h("div",{class:"meter-label"},[h("span",{},st.done+" / "+st.total+" done"),h("span",{},st.pct+"%")])])
  ]);
}

function taskRow(t, showEvent){
  var cb = h("input",{type:"checkbox","aria-label":"Mark "+t.title+" done"}); cb.checked = !!t.done;
  cb.addEventListener("change", function(){ toggleTask(t, cb.checked); });
  return h("div",{class:"task"+(t.done?" is-done":"")},[cb,
    h("div",{class:"body"},[
      h("div",{class:"title"},t.title),
      h("div",{class:"meta"},[
        showEvent ? h("a",{href:"#",onclick:function(e){e.preventDefault(); openEvent(t.event_id);}}, t.event_name) : h("span",{class:"pill"},t.category),
        h("span",{},fmtDate(t.due_date)), statusChip(t), t.owner ? h("span",{},"👤 "+t.owner) : null,
        t.notes ? h("span",{title:t.notes},"📝 note") : null
      ])
    ]),
    showEvent ? null : h("button",{class:"btn ghost",title:"Edit",onclick:function(){ openTaskEditor(t); }},"Edit")
  ]);
}

// ---------- events list
function renderEvents(root){
  var evs = S.data.events.slice();
  var active = evs.filter(function(e){return !e.archived;}), archived = evs.filter(function(e){return e.archived;});
  root.appendChild(h("div",{class:"card"},[h("h2",{},"Active events"), active.length ? h("div",{},active.map(eventRow)) : h("div",{class:"empty"},"No active events yet.")]));
  if (archived.length) root.appendChild(h("div",{class:"card"},[h("h2",{},"Archived"), h("div",{},archived.map(eventRow))]));
}

// ---------- single event
function openEvent(id){ S.view="event"; S.eventId=id; location.hash="event/"+id; render(); window.scrollTo(0,0); }
function renderEvent(root){
  var ev = S.data.events.find(function(e){return e.id===S.eventId;});
  if (!ev){ S.view="events"; return renderEvents(root); }
  var st = eventStats(ev.id), dd = daysBetween(today(), ev.event_date);
  var tasks = S.data.tasks.filter(function(t){return t.event_id===ev.id;});
  var cats = Array.from(new Set(tasks.map(function(t){return t.category;}))).sort();

  root.appendChild(h("div",{class:"card"},[
    h("div",{style:"display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap"},[
      h("div",{style:"flex:1;min-width:220px"},[
        h("div",{style:"font-size:1.25rem;font-weight:600"},ev.name),
        h("div",{class:"muted"},fmtDate(ev.event_date)+" · "+(dd>=0?relDays(dd):"past")+(ev.location?" · "+ev.location:"")+(ev.archived?" · Archived":"")),
        ev.notes ? h("p",{style:"margin:8px 0 0;white-space:pre-wrap;font-size:.9rem"},ev.notes) : null
      ]),
      h("div",{style:"display:flex;gap:6px;flex-wrap:wrap"},[
        h("button",{class:"btn secondary",onclick:function(){openEditEvent(ev);}},"Edit event"),
        h("button",{class:"btn secondary",onclick:function(){ api("POST","/api/events/"+ev.id+"/apply-template").then(function(r){ toast(r.added ? r.added+" standard task(s) added" : "Already has every standard task"); load(); }); }},"Sync standard list"),
        h("button",{class:"btn secondary",onclick:function(){ api("PATCH","/api/events/"+ev.id,{archived:!ev.archived}).then(load); }}, ev.archived?"Unarchive":"Archive")
      ])
    ]),
    h("div",{style:"margin-top:14px"},[h("div",{class:"meter"+(st.pct===100?" complete":"")},h("span",{style:"width:"+st.pct+"%"})),
      h("div",{class:"meter-label"},[h("span",{},st.done+" of "+st.total+" done"+(st.overdue?" · "+st.overdue+" overdue":"")+(st.soon?" · "+st.soon+" due this week":"")),h("span",{},st.pct+"%")])])
  ]));

  // add task
  var f = { title:h("input",{placeholder:"New task…"}), due:h("input",{type:"date"}), cat:h("input",{placeholder:"Category",list:"cats"}), owner:h("input",{placeholder:"Owner"}) };
  root.appendChild(h("div",{class:"card"},[
    h("datalist",{id:"cats"}, cats.map(function(c){return h("option",{value:c});})),
    h("form",{class:"form-row",onsubmit:function(e){ e.preventDefault(); if(!f.title.value.trim()) return;
        api("POST","/api/events/"+ev.id+"/tasks",{title:f.title.value,due_date:f.due.value,category:f.cat.value,owner:f.owner.value}).then(function(){ toast("Task added"); load(); }).catch(function(e){toast(e.message);}); }},[
      h("div",{},[h("label",{},"Task"),f.title]), h("div",{},[h("label",{},"Due"),f.due]), h("div",{},[h("label",{},"Category"),f.cat]), h("div",{},[h("label",{},"Owner"),f.owner]),
      h("button",{class:"btn",type:"submit"},"Add")])
  ]));

  // filters
  var sel = h("select",{onchange:function(){ S.filter=sel.value; render(); }},[["open","Open tasks"],["overdue","Overdue"],["soon","Due in 7 days"],["done","Completed"],["all","All tasks"]].map(function(o){ return h("option",{value:o[0],selected:S.filter===o[0]},o[1]); }));
  var csel = h("select",{onchange:function(){ S.catFilter=csel.value; render(); }},[h("option",{value:""},"All categories")].concat(cats.map(function(c){return h("option",{value:c,selected:S.catFilter===c},c);})));
  var shown = tasks.filter(function(t){
    var s = taskState(t);
    if (S.catFilter && t.category!==S.catFilter) return false;
    if (S.filter==="open") return !t.done; if (S.filter==="done") return t.done;
    if (S.filter==="overdue") return s==="overdue"; if (S.filter==="soon") return s==="soon"; return true;
  });
  var list = h("div",{});
  if (!shown.length) list.appendChild(h("div",{class:"empty"},"No tasks match this filter."));
  shown.forEach(function(t){ list.appendChild(taskRow(t,false)); });
  root.appendChild(h("div",{class:"card"},[h("div",{class:"toolbar"},[h("h2",{style:"margin:0;margin-right:auto"},"Tasks"),sel,csel]), list]));
}

// ---------- template
function renderTemplate(root){
  var rows = S.data.template;
  var tbody = h("tbody");
  rows.forEach(function(t){
    function inp(field, attrs){ var i=h("input",Object.assign({value:t[field]},attrs||{})); i.addEventListener("change",function(){ var b={}; b[field]=i.value; api("PATCH","/api/template/"+t.id,b).then(function(n){ Object.assign(t,n); toast("Saved"); }); }); return i; }
    tbody.appendChild(h("tr",{},[
      h("td",{},inp("title")), h("td",{style:"width:150px"},inp("category")),
      h("td",{style:"width:110px"},inp("offset_days",{type:"number"})),
      h("td",{style:"width:40px"},h("button",{class:"btn ghost",title:"Remove",onclick:function(){ if(confirm("Remove “"+t.title+"” from the standard checklist? (Existing events keep their copy.)")) api("DELETE","/api/template/"+t.id).then(load); }},"✕"))
    ]));
  });
  var f = { title:h("input",{placeholder:"New standard task…"}), cat:h("input",{placeholder:"Category"}), off:h("input",{type:"number",placeholder:"-30"}) };
  root.appendChild(h("div",{class:"card"},[
    h("h2",{},"Standard checklist"),
    h("p",{class:"muted",style:"margin-top:-4px"},"Every new event starts with these tasks. “Days from race” sets the due date: −30 means 30 days before race day, 7 means a week after. Changes here apply to new events; use “Sync standard list” on an event to pull in newly added tasks."),
    h("table",{class:"tmpl"},[h("thead",{},h("tr",{},[h("th",{},"Task"),h("th",{},"Category"),h("th",{},"Days from race"),h("th",{})])), tbody]),
    h("form",{class:"form-row",style:"grid-template-columns:2fr 1fr 110px auto;margin-top:12px",onsubmit:function(e){ e.preventDefault(); if(!f.title.value.trim())return;
      api("POST","/api/template",{title:f.title.value,category:f.cat.value,offset_days:f.off.value}).then(function(){ toast("Added"); load(); }); }},
      [h("div",{},f.title),h("div",{},f.cat),h("div",{},f.off),h("button",{class:"btn",type:"submit"},"Add")])
  ]));
}

// ---------- dialogs
var dlg = document.getElementById("dlg");
function modal(title, fields, onSave, extra){
  dlg.innerHTML = "";
  var form = h("form",{method:"dialog",onsubmit:function(e){ e.preventDefault(); Promise.resolve(onSave()).then(function(ok){ if(ok!==false) dlg.close(); }).catch(function(err){ toast(err.message); }); }},
    [h("h2",{},title)].concat(fields.map(function(f){ return h("div",{class:"field"},[h("label",{},f[0]),f[1]]); }))
      .concat([h("div",{class:"actions"},[extra||null, h("span",{style:"flex:1"}), h("button",{class:"btn secondary",type:"button",onclick:function(){dlg.close();}},"Cancel"), h("button",{class:"btn",type:"submit"},"Save")])]));
  dlg.appendChild(form); dlg.showModal();
}
function openNewEvent(){
  var name=h("input",{required:true,placeholder:"e.g. Spring Criterium"}), date=h("input",{type:"date",required:true}), loc=h("input",{placeholder:"City, venue"}), notes=h("textarea",{rows:3});
  var useT=h("input",{type:"checkbox"}); useT.checked=true;
  modal("New race event",[["Event name",name],["Race date",date],["Location",loc],["Notes",notes],["Start from the standard checklist ("+S.data.template.length+" tasks)",useT]], function(){
    return api("POST","/api/events",{name:name.value,event_date:date.value,location:loc.value,notes:notes.value,apply_template:useT.checked}).then(function(ev){ toast("Event created"); return load().then(function(){ openEvent(ev.id); }); });
  });
}
function openEditEvent(ev){
  var name=h("input",{value:ev.name}), date=h("input",{type:"date",value:ev.event_date}), loc=h("input",{value:ev.location}), notes=h("textarea",{rows:3}); notes.value=ev.notes;
  var shift=h("input",{type:"checkbox"}); shift.checked=true;
  modal("Edit event",[["Event name",name],["Race date",date],["If the date changes, move open task due dates with it",shift],["Location",loc],["Notes",notes]], function(){
    return api("PATCH","/api/events/"+ev.id,{name:name.value,event_date:date.value,location:loc.value,notes:notes.value,shift_tasks:shift.checked}).then(function(){ toast("Saved"); return load(); });
  }, h("button",{class:"btn danger",type:"button",onclick:function(){ if(confirm("Delete “"+ev.name+"” and all its tasks? This cannot be undone.")) api("DELETE","/api/events/"+ev.id).then(function(){ dlg.close(); S.view="events"; load(); }); }},"Delete"));
}
function openTaskEditor(t){
  var title=h("input",{value:t.title}), due=h("input",{type:"date",value:t.due_date||""}), cat=h("input",{value:t.category}), owner=h("input",{value:t.owner}), notes=h("textarea",{rows:3}); notes.value=t.notes;
  modal("Edit task",[["Task",title],["Due date",due],["Category",cat],["Owner",owner],["Notes",notes]], function(){
    return api("PATCH","/api/tasks/"+t.id,{title:title.value,due_date:due.value,category:cat.value,owner:owner.value,notes:notes.value}).then(function(){ toast("Saved"); return load(); });
  }, h("button",{class:"btn danger",type:"button",onclick:function(){ if(confirm("Delete this task?")) api("DELETE","/api/tasks/"+t.id).then(function(){ dlg.close(); load(); }); }},"Delete"));
}

// ---------- login
function renderLogin(){
  app.innerHTML="";
  var pw=h("input",{type:"password",placeholder:"Password",autofocus:true});
  app.appendChild(h("div",{class:"card login"},[h("div",{style:"font-size:2rem"},"🏁"),h("h2",{},"Race Event To-Do"),
    h("form",{onsubmit:function(e){ e.preventDefault(); api("POST","/api/login",{password:pw.value}).then(boot).catch(function(err){ toast(err.message); }); }},
      [pw, h("button",{class:"btn",type:"submit",style:"width:100%;justify-content:center;margin-top:10px"},"Sign in")])]));
}

function boot(){
  api("GET","/api/me").then(function(me){
    S.passwordRequired = me.passwordRequired;
    if (!me.authed) return renderLogin();
    var m = location.hash.match(/^#event\/(\d+)/);
    if (m){ S.view="event"; S.eventId=Number(m[1]); }
    else if (/^#(events|template)$/.test(location.hash)) S.view=location.hash.slice(1);
    return load();
  });
}
boot();
</script>
</body>
